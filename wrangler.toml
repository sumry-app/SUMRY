# Cloudflare Pages configuration.
#
# The app is a static Vite build with no server component, so Pages hosts it
# directly. `sumry.pages.dev` serves the site from the domain root, which is why
# VITE_BASE_PATH stays at its "/" default here - unlike GitHub Pages, which
# needs "/SUMRY/". See .github/workflows/deploy-cloudflare.yml.
name = "sumry"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
