name: Deploy to Cloudflare Pages

# Cloudflare Pages is the primary host. It serves the app from the domain root
# (so VITE_BASE_PATH stays at its "/" default) and gives every pull request its
# own preview URL, which is the part GitHub Pages cannot do.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard -> Workers & Pages -> Account ID
#   VITE_SUPABASE_URL      - Supabase project URL
#   VITE_SUPABASE_ANON_KEY - Supabase anon/public key
#
# The Cloudflare pair is checked before the deploy step, not by it. Until those
# two secrets exist the job skips the deploy and says so in its summary, because
# a missing credential is a setup step, not a failing test - and a check that
# goes red on every pull request is a check people learn to ignore.
#
# See DEPLOYMENT.md for the one-time project setup and the dashboard-managed
# alternative (connecting the repository directly in Cloudflare).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Surfaced to the steps below; never printed.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare serves from the root of the domain. Leaving this unset
          # would also default to "/", but stating it here documents that the
          # Pages subpath GitHub Pages needs must NOT leak into this build.
          VITE_BASE_PATH: /
        run: npm run build

      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages: not deployed"
              echo ""
              echo "The tests and build above passed. \`CLOUDFLARE_API_TOKEN\` and/or"
              echo "\`CLOUDFLARE_ACCOUNT_ID\` are not set as repository secrets, so there"
              echo "was no credential to deploy with. See DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # `pages deploy` (rather than `pages publish`) is the current command.
          command: >-
            pages deploy dist
            --project-name=sumry
            --branch=${{ github.head_ref || github.ref_name }}
            ${{ github.event_name == 'pull_request' && '--commit-dirty=true' || '' }}

      - name: Summarise the deployment
        if: steps.credentials.outputs.ready == 'true'
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed \`${{ github.head_ref || github.ref_name }}\` to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
